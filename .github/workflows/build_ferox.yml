name: Build Ferox Browser Releases

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-desktop-app:
    name: Build Ferox Desktop Browser
    runs-on: windows-latest

    steps:
      - name: Checkout Ferox Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Ferox Executable
        run: npx electron-builder --win

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferox-windows-installer
          path: dist/*.exe
